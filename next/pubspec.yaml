name: ephemeron
description: >
  Ephemeron — cross-platform calendar, tasks, habits, and focus app.
  Small tasks are ephemeral; little by little, they add up.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  permission_handler: ^12.0.3

  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  path: ^1.9.0

  shared_preferences: ^2.3.2
  uuid: ^4.6.0

  google_sign_in: ^7.1.0
  http: ^1.2.2
  flutter_secure_storage: ^10.3.1

  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  googleapis: ^16.0.0
  table_calendar: ^3.1.2

  wakelock_plus: ^1.2.8
  device_calendar_plus: ^0.7.1
  battery_plus: ^7.1.1
  local_notifier: ^0.1.6

  google_sign_in_platform_interface: any
  google_sign_in_web: any
  flutter_native_splash: ^2.4.8
  pasteboard: ^0.5.0
  file_selector: ^1.1.0
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.3
  meta: ^1.18.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

dependency_overrides:
  flutter_timezone:
    path: packages/flutter_timezone
  wakelock_plus:
    path: packages/wakelock_plus
  device_calendar_plus_android:
    path: packages/device_calendar_plus_android
  pasteboard:
    path: packages/pasteboard
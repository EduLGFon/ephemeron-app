name: wakelock_plus
description: >-2
  Plugin that allows you to keep the device screen awake, i.e. prevent the screen from sleeping on
  Android, iOS, macOS, Windows, Linux, and web.
version: 1.6.1
repository: https://github.com/fluttercommunity/wakelock_plus/tree/main/wakelock_plus

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.17.0
  wakelock_plus_platform_interface: ^1.5.1

  # Windows dependencies
  win32: ">=6.0.1 <7.0.0"

  # Linux dependencies
  dbus: ^0.7.12
  package_info_plus: ">=10.1.0 <11.0.0"

  # Web dependencies
  web: ">=0.5.1 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.2.3 # dart run pigeon --input "pigeons/messages.dart"
  mocktail: ^1.0.5
  
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
# flutter plugin declaration removed for web build

name: ephemeron
description: "Offline-first privacy-first calendar, tasks, habits, focus, countdowns and notes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  intl: 0.20.3
  go_router: 18.1.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  uuid: 4.6.0
  timezone: ^0.11.2
  http: 1.6.0
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3
  flutter_secure_storage: 11.2.0
  markdown: 7.3.1
  image: 4.3.0
  device_calendar_plus: 0.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.17.1
  drift_dev: 2.35.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Subset.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Subset.ttf
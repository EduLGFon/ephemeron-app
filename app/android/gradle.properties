# Gradle settings for a 4-thread / 16 GB developer laptop.
# Keep the template heap. The daemon commits only what it needs, and a 4 GB cap
# made R8 fill the old generation and spend its time in full GC. See
# docs/BUILD_PERFORMANCE.md.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2G
# The Flutter Gradle plugin is not configuration-cache compatible yet
# (flutter/flutter#192035). Keep this off even if a global gradle.properties
# enables it.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
